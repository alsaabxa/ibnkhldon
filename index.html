<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Arial,sans-serif}.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 18px;box-shadow:0 5px 20px #0002}.topbar .inner{max-width:1450px;margin:auto;display:flex;align-items:center;gap:13px}.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#facc15,#eab308);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 6px 18px #0003}.brand h1{font-size:18px;margin:0}.brand p{margin:1px 0 0;color:#d9e7f1;font-size:11px}.clock{margin-right:auto;text-align:left;line-height:1.45;font-size:12px}.clock b{font-size:15px;display:block}.wrap{max-width:1450px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e7edf2;border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}.hidden{display:none!important}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:20px;border-radius:18px;background:#fff;border:1px solid var(--line)}.stat b{display:block;font-size:30px;color:var(--navy)}.stat span{color:var(--muted);font-size:13px}h2,h3{margin-top:0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{padding:10px 15px;border-radius:12px;background:#eef3f7;color:var(--text);font-weight:700}.btn.primary{background:var(--teal);color:#fff}.btn.navy{background:var(--navy);color:#fff}.btn.gold{background:var(--gold);color:#102a43}.btn.danger{background:#fee4e2;color:var(--danger)}.btn.sm{padding:7px 10px;font-size:12px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0f766e18}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}.field{margin-bottom:12px}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px rgba(16,42,67,.06)}.nav button{padding:10px 15px;border:0;border-radius:14px;background:transparent;color:var(--navy);font-weight:800;transition:.2s;cursor:pointer}.nav button:hover{background:#eef6f5;transform:translateY(-1px)}.nav button.active{background:linear-gradient(135deg,var(--navy),#17496d);color:#fff;box-shadow:0 6px 16px rgba(16,42,67,.18)}.class-card{border:1px solid var(--line);border-radius:18px;padding:17px;background:#fff}.class-card h3{margin:0 0 8px}.progress{height:10px;background:#e7edf2;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--teal);border-radius:99px}.muted{color:var(--muted);font-size:13px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#edf7f5;color:var(--teal);font-size:12px;font-weight:700}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf1f4;text-align:right;font-size:13px}th{background:#f7f9fb}.modal{position:fixed;inset:0;background:#07182799;z-index:50;display:grid;place-items:center;padding:18px}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:22px}.login{min-height:calc(100vh - 80px);display:grid;place-items:center}.loginbox{width:min(460px,100%);text-align:center}.loginbox .logo{margin:0 auto 12px}.toast{position:fixed;left:20px;bottom:20px;z-index:100;background:var(--navy);color:#fff;padding:13px 18px;border-radius:14px;box-shadow:var(--shadow);display:none}.toast.show{display:block}.scan-hero{padding:20px;border-radius:22px;background:linear-gradient(135deg,#102a43,#0f766e);color:#fff}.scan-hero.ok{animation:glow 1.2s ease}.pulse-btn{animation:btnPulse .8s ease}.barcode-btn{font-size:20px;min-width:52px}.thanks{margin-top:14px;padding:16px;border-radius:16px;background:linear-gradient(135deg,#effaf4,#fff);border:1px solid #9bd8b8;text-align:center}.behavior-selects{display:flex;gap:8px;flex-wrap:wrap}.behavior-selects .chip{user-select:none}.settings-danger{background:#fff5f4;border:1px solid #f2c3bf}.scan-input{font-size:22px;text-align:center;font-weight:800;letter-spacing:2px}.student-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.student-row{padding:12px;border:1px solid var(--line);border-radius:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}.student-row.present{border-color:#74c69d;background:#effaf4}.student-row.absent{border-color:#f1a6a0;background:#fff4f3}.drop{border:2px dashed #b9c8d5;border-radius:16px;padding:25px;text-align:center;background:#fafcfd}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:9px 14px;border-radius:14px;background:#eaf0f5;cursor:pointer;font-weight:800;transition:.18s;min-height:42px;display:inline-flex;align-items:center;justify-content:center}.chip:hover{transform:translateY(-1px)}.chip.sel{background:var(--teal);color:#fff;box-shadow:0 5px 14px rgba(15,118,110,.22)}.behavior-selects{gap:10px}.behavior-selects .chip{flex:1 1 150px;font-size:14px}.behavior-chips .chip{font-size:13px;min-height:40px}.vote-btn{background:#fff4cf!important;color:#7a5600!important;border:1px solid #efd47b!important}.vote-btn.voted{background:#e8f7ee!important;color:#087443!important;border-color:#9bd8b8!important}.chip.sm{padding:5px 8px;font-size:11px}.student-row{flex-direction:column;align-items:stretch}.behavior-chips{margin-top:8px}.qrgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.qr{text-align:center}.qrbox{display:grid;place-items:center;margin:12px auto}.footer{text-align:center;color:var(--muted);padding:25px 10px 35px;font-size:13px}.footer b{color:var(--navy)}.chartbox{position:relative;height:290px;border:1px solid var(--line);border-radius:18px;padding:12px;background:#fff}.chartbox canvas{width:100%;height:100%}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px}.legend span{display:inline-flex;gap:5px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.success{color:var(--ok);font-weight:800}.brandmark{font-size:26px;font-weight:800;color:var(--gold);margin-bottom:3px}.login-help{background:#fff8db;border:1px solid #f5df86;padding:10px;border-radius:12px;font-size:12px;color:#6b5200}
@keyframes glow{0%{box-shadow:0 0 0 #eab30800}35%{box-shadow:0 0 38px #eab308bb}100%{box-shadow:0 0 0 #eab30800}}@keyframes btnPulse{0%{transform:scale(1);box-shadow:0 0 0 #0f766e00}50%{transform:scale(1.06);box-shadow:0 0 22px #0f766e88}100%{transform:scale(1);box-shadow:0 0 0 #0f766e00}}@media(max-width:1100px){.wrap{padding:16px}.g4{grid-template-columns:repeat(2,1fr)}.g3,.qrgrid{grid-template-columns:1fr 1fr}.student-list{grid-template-columns:1fr 1fr}.clock{display:none}}
@media(max-width:950px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.qrgrid{grid-template-columns:1fr 1fr}.student-list{grid-template-columns:1fr 1fr}.clock{display:none}}@media(max-width:600px){.btn{min-height:44px}.nav button{min-height:42px}.student-row{padding:10px}.modalbox{padding:16px}.wrap{padding:13px}.g4,.g3,.g2,.qrgrid,.student-list{grid-template-columns:1fr}.topbar{padding:10px}.brand h1{font-size:15px}.brand p{font-size:10px}}
@media print{.topbar,.nav,.no-print,.footer{display:none!important}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:0}}
.teacher-vote-row{display:flex;gap:10px;align-items:stretch}.teacher-vote-row #teacher{flex:1}.teacher-vote-button{white-space:nowrap}.behavior-active-wrap{font-weight:800}@media(max-width:700px){.teacher-vote-row{flex-direction:column}.teacher-vote-button{width:100%}} </style>

<body>
<header class="topbar"><div class="inner"><div class="logo">73</div><div class="brand"><div class="brandmark">✦</div><h1>منصة تعزيز السلوك الإيجابي</h1><p>الابتدائية الثالثة والسبعون بمكة المكرمة</p></div><div class="clock"><b id="clockTime">--:--:--</b><span id="clockDates">جاري تحميل التاريخ...</span></div></div></header>
<main id="app" class="wrap"></main>
<div id="toast" class="toast"></div><div id="modal" class="modal hidden"></div>
<footer class="footer">الموجهة الطلابية <b>الأستاذة مها العتيبي</b><br><b>الأستاذة فاطمة الصعب</b><br>مديرة المدرسة: <b>الأستاذة عبير الحربي</b></footer>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz_Xr0tK86p3F4Sf7OxJrXc8ykyZ8NcDo-egH5_6RBW0bwlVIyxvI0Jn_0if3lzEsJmBg/exec";
const SCHOOL_NAME="الابتدائية الثالثة والسبعون بمكة المكرمة";
const STORE_KEY="positive_behavior_73_v2",SESSION_KEY="positive_behavior_session_v2";
const DEFAULT_BEHAVIORS=["التعاون","الاحترام","الإنضباط","المثابرة"];
let BEHAVIORS=[...DEFAULT_BEHAVIORS];
const SETTINGS_KEY="positive_behavior_73_settings_v2";
const state={classes:[],students:[],staff:[],attendance:[],teacherNames:[]};
let route="dashboard",selectedClassId="",editingId="",pollTimer=null,lastScanStudent=null,clockTimer=null;
const $=s=>document.querySelector(s);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const uid=p=>p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
function today(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh"}).format(new Date())}
function timeNow(){return new Intl.DateTimeFormat("ar-SA",{timeZone:"Asia/Riyadh",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date())}
function dateTimes(){const d=new Date();return {h:new Intl.DateTimeFormat("ar-SA-u-ca-islamic",{timeZone:"Asia/Riyadh",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(d),g:new Intl.DateTimeFormat("ar-SA",{timeZone:"Asia/Riyadh",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(d)}}
function updateClock(){const d=dateTimes();if($("#clockTime"))$("#clockTime").textContent=timeNow();if($("#clockDates"))$("#clockDates").textContent="هجري: "+d.h+" | ميلادي: "+d.g}
function saveLocal(){localStorage.setItem(STORE_KEY,JSON.stringify(state));saveSettings()}
function loadSettings(){try{const x=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");if(Array.isArray(x.behaviors)&&x.behaviors.length){BEHAVIORS=x.behaviors.map(b=>typeof b==="string"?{name:b,weight:25}:{name:b.name,weight:Number(b.weight)||0}).filter(b=>b.name); } else BEHAVIORS=DEFAULT_BEHAVIORS.map(name=>({name,weight:25})); if(x.principalVoteWeight!=null) window.principalVoteWeight=Number(x.principalVoteWeight)||2; else window.principalVoteWeight=2}catch{BEHAVIORS=DEFAULT_BEHAVIORS.map(name=>({name,weight:25}));window.principalVoteWeight=2}}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify({behaviors:BEHAVIORS,principalVoteWeight:window.principalVoteWeight||2}))}
function behaviorNames(){return BEHAVIORS.map(x=>typeof x==="string"?x:x.name)}
function behaviorWeight(name){const b=BEHAVIORS.find(x=>(x.name||x)===name);return Number(b?.weight||0)}
function loadLocal(){loadSettings();try{const x=JSON.parse(localStorage.getItem(STORE_KEY)||"{}");Object.assign(state,{classes:x.classes||[],students:x.students||[],staff:x.staff||[],attendance:x.attendance||[],
teacherNames:x.teacherNames||[],behaviorConfig:x.behaviorConfig||[],principalVoteWeight:Number(x.principalVoteWeight??2)||2,principalVotes:x.principalVotes||[]});
BEHAVIORS=(state.behaviorConfig.length?state.behaviorConfig:DEFAULT_BEHAVIORS.map((name,i)=>({id:"B"+i,name,weight:25}))).map(x=>typeof x==="string"?x:x.name).filter(Boolean);}catch{}if(!state.staff.length){state.staff.push({id:"ST_default_admin",name:"مديرة النظام",role:"مديرة النظام",username:"admin",password:"123456",classes:"*"});saveLocal()}}
function session(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch{return null}}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3000)}
function configured(){return SCRIPT_URL&&!SCRIPT_URL.startsWith("ضع_هنا")}
function api(action,payload={}){if(!configured())return Promise.resolve({ok:false,error:"لم يتم وضع رابط Web App بعد"});return fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,payload})}).then(r=>r.json()).catch(e=>({ok:false,error:e.message}))}
function pull(silent=true){if(!configured())return;fetch(SCRIPT_URL+"?action=bootstrap&_="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(x=>{if(x.ok!==false){state.classes=x.classes||[];state.students=x.students||[];state.staff=x.staff||[];state.attendance=x.attendance||[];state.teacherNames=x.teacherNames||[];
state.behaviorConfig=x.behaviorConfig||state.behaviorConfig||[];
state.principalVoteWeight=Number(x.principalVoteWeight??state.principalVoteWeight??2)||2;
state.principalVotes=x.principalVotes||state.principalVotes||[];
BEHAVIORS=(state.behaviorConfig.length?state.behaviorConfig:DEFAULT_BEHAVIORS.map((name,i)=>({id:"B"+i,name,weight:25}))).map(x=>typeof x==="string"?x:x.name).filter(Boolean);
saveLocal();if(!silent)toast("تم تحديث البيانات");render(false)}}).catch(()=>{})}
function push(action,payload){api(action,payload).then(x=>{if(!x.ok)toast("تم الحفظ محلياً، وتعذرت المزامنة: "+(x.error||""))})}
function go(r,cid=""){route=r;selectedClassId=cid||selectedClassId;render()}
function currentClass(){return state.classes.find(c=>String(c.id)===String(selectedClassId))}
function isAdmin(){const s=session();return !!(s&&(s.role==="مديرة النظام"||s.role==="مديرة"||s.username==="admin"||s.id==="admin"))}
function canAccessClass(cid){const s=session();if(!s)return false;return isAdmin()||s.classes==="*"||String(s.classes||"").split(",").includes(String(cid))}
function nav(){return `<div class="nav no-print"><button class="${route==='dashboard'?'active':''}" onclick="go('dashboard')">الرئيسية</button><button class="${route==='classes'?'active':''}" onclick="go('classes')">الفصول والطالبات</button><button class="${route==='scan'?'active':''}" onclick="go('scan')">رصد السلوك</button><button class="${route==='qr'?'active':''}" onclick="go('qr')">أكواد QR</button><button class="${route==='staff'?'active':''}" onclick="go('staff')">الإداريات</button><button class="${route==='reports'?'active':''}" onclick="go('reports')">التقارير</button><button class="${route==='settings'?'active':''}" onclick="go('settings')">الإعدادات</button><button onclick="logout()">خروج</button></div>`}
function render(){loadLocal();const q=new URLSearchParams(location.search).get("class");if(q)selectedClassId=q;const s=session();if(!s&&q){route="scan";$("#app").innerHTML=renderScan(true);return}if(!s){renderLogin();return}const map={dashboard:renderDashboard,classes:renderClasses,scan:renderScan,qr:renderQR,staff:renderStaff,reports:renderReports,settings:renderSettings};$("#app").innerHTML=nav()+(map[route]||renderDashboard)();if(route==="qr")setTimeout(afterQr,30);if(route==="dashboard")setTimeout(drawCharts,30)}
function renderLogin(){ $("#app").innerHTML=`<section class="login"><div class="card loginbox"><div class="logo">73</div><div class="brandmark">✦</div><h2>تسجيل الدخول</h2><p class="muted">${esc(SCHOOL_NAME)}</p><div class="field"><label>اسم المستخدم</label><input id="loginUser" autocomplete="username" placeholder="أدخل اسم المستخدم"></div><div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()" placeholder="أدخل كلمة المرور"></div><button class="btn primary" style="width:100%" onclick="login()">دخول إلى المنصة</button></div></section>`}
async function login(){
  // تسجيل الدخول الرئيسي للمديرة
  if (String($("#loginUser").value).trim() === "admin" && String($("#loginPass").value) === "123456") {
    state.user = {id:"admin", name:"المديرة", role:"مديرة النظام", username:"admin", classes:"*"};
    saveLocal();
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      id:"admin",
      name:"المديرة",
      role:"مديرة النظام",
      classes:"*"
    }));
    startPolling();
    go("dashboard");
    return;
  }

  const u=$("#loginUser").value.trim(),p=$("#loginPass").value;
  if(!u||!p){toast("أدخلي اسم المستخدم وكلمة المرور");return}
  const btn=document.querySelector(".loginbox .btn.primary");
  if(btn){btn.disabled=true;btn.textContent="جاري التحقق..."}
  try{
    if(configured()){
      const res=await fetch(SCRIPT_URL+"?action=bootstrap&_="+Date.now(),{cache:"no-store"});
      const data=await res.json();
      if(data.ok===false) throw new Error(data.error||"تعذر الاتصال");
      state.classes=data.classes||[];
      state.students=data.students||[];
      state.staff=data.staff||[];
      state.attendance=data.attendance||[];
      state.teacherNames=data.teacherNames||[];
      state.behaviorConfig=data.behaviorConfig||[];
      state.principalVoteWeight=Number(data.principalVoteWeight??2)||2;
      state.principalVotes=data.principalVotes||[];
      BEHAVIORS=(state.behaviorConfig.length?state.behaviorConfig:DEFAULT_BEHAVIORS.map((name,i)=>({id:"B"+i,name,weight:25}))).map(x=>typeof x==="string"?x:x.name).filter(Boolean);
      saveLocal();
    }
    const x=state.staff.find(a=>String(a.username).trim()===u&&String(a.password)===String(p));
    if(!x){toast("اسم المستخدم أو كلمة المرور غير صحيحة");return}
    localStorage.setItem(SESSION_KEY,JSON.stringify({id:x.id,name:x.name,role:x.role,classes:x.classes}));
    startPolling();go("dashboard");
  }catch(e){
    toast("تعذر الاتصال بالمنصة: "+e.message);
  }finally{
    if(btn){btn.disabled=false;btn.textContent="دخول إلى المنصة"}
  }
}
function logout(){localStorage.removeItem(SESSION_KEY);if(pollTimer)clearInterval(pollTimer);render()}
function startPolling(){if(pollTimer)clearInterval(pollTimer);pull(true);pollTimer=setInterval(()=>pull(true),4000)}

function hasBehavior(rec,b){
  const v=String(rec?.behavior||rec?.status||"");
  return v.split(/[،,]/).map(x=>x.trim()).includes(b);
}
function selectedBehaviors(){
  const cfg=state.behaviorConfig||[];
  if(cfg.length){
    return cfg.filter(x=>x.active===true || String(x.active).toLowerCase()==="true")
      .sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0))
      .map(x=>String(x.name||"").trim()).filter(Boolean);
  }
  return [...DEFAULT_BEHAVIORS];
}
function behaviorNames(){return selectedBehaviors();}

function flashButtons(){
  document.querySelectorAll('.scan-action').forEach(b=>{
    b.classList.remove('pulse-btn'); void b.offsetWidth; b.classList.add('pulse-btn');
    setTimeout(()=>b.classList.remove('pulse-btn'),900);
  });
}
function thankTeacher(name){
  const box=$("#teacherThanks");
  if(box) box.innerHTML=`<div class="thanks">🌷 <b>شكرًا لكِ ${esc(name||"يا معلمة")}</b><br><span class="muted">شكرًا لجهودكِ الجميلة في رصد وتعزيز السلوك الإيجابي لطالباتكِ.</span></div>`;
}

function principalVote(id){

  }else{

}
function saveScan(){const c=currentClass(),rows=state.attendance.filter(a=>a.date===today()&&String(a.classId)===String(c?.id));if(!c||!rows.length){toast("لا توجد سجلات للحفظ");return}const teacher=$("#teacher")?.value.trim();rows.forEach(x=>{if(teacher)x.teacher=teacher});saveLocal();push("saveAttendance",rows);toast("تم حفظ واعتماد الرصد بنجاح");beepSuccess()}function saveAllStudentsToday(){

function exportCurrentExcel(){const f=getReportFilter(),rows=reportRowsForCurrent(),data=rows.map(a=>({'الفصل':state.classes.find(c=>String(c.id)===String(a.classId))?.name||'','رقم الطالبة':state.students.find(s=>s.id===a.studentId)?.number||'','اسم الطالبة':a.studentName,'السلوك':a.behavior||a.status,'المعلمة':a.teacher,'الوقت':a.time,'التاريخ':a.date})),wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(data);XLSX.utils.book_append_sheet(wb,ws,'التقرير');XLSX.writeFile(wb,`تقرير_السلوك_${f.from}_${f.to}.xlsx`);toast("تم تصدير Excel")}
function reportHTMLCurrent(){const f=getReportFilter(),rows=reportRowsForCurrent(),counts=BEHAVIORS.map(b=>rows.filter(x=>hasBehavior(x,b)).length),max=Math.max(1,...counts);return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><title>تقرير تعزيز السلوك الإيجابي</title><style>body{font-family:Cairo,Arial,sans-serif;color:#102a43;margin:0}main{max-width:1100px;margin:auto;padding:28px}.head{text-align:center;border-bottom:3px solid #0f766e;padding-bottom:16px}.head h1{font-size:30px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid #dbe4ec;border-radius:14px;padding:12px;text-align:center}.num{font-size:25px;font-weight:800;color:#0f766e}.chart{display:flex;align-items:flex-end;justify-content:center;gap:30px;height:240px;margin:25px}.bar{width:65px;background:#0f766e;border-radius:8px 8px 0 0;position:relative}.bar span{position:absolute;top:100%;left:-20px;right:-20px;text-align:center;margin-top:8px}.bar b{position:absolute;top:-25px;left:0;right:0;text-align:center}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #dbe4ec;padding:8px}th{background:#102a43;color:#fff}.foot{text-align:center;margin-top:40px;padding-top:15px;border-top:1px solid #dbe4ec;font-weight:700;line-height:1.9}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="head"><h1>منصة تعزيز السلوك الإيجابي</h1><div>${esc(SCHOOL_NAME)}</div><div>تقرير من ${esc(f.from)} إلى ${esc(f.to)}</div></div><div class="cards"><div class="card"><div class="num">${rows.length}</div>إجمالي الرصد</div><div class="card"><div class="num">${new Set(rows.map(x=>x.studentId)).size}</div>طالبات</div><div class="card"><div class="num">${counts[0]}</div>التعاون</div><div class="card"><div class="num">${counts[1]}</div>الاحترام</div></div><h2>الرسم البياني</h2><div class="chart">${counts.map((v,i)=>`<div class="bar" style="height:${Math.max(8,Math.round(v/max*180))}px"><b>${v}</b><span>${esc(behaviorNames()[i])}</span></div>`).join("")}</div><h2>تفاصيل الرصد</h2><table><thead><tr><th>التاريخ</th><th>الفصل</th><th>الطالبة</th><th>السلوك</th><th>المعلمة</th><th>الوقت</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(state.classes.find(c=>String(c.id)===String(a.classId))?.name||"")}</td><td>${esc(a.studentName)}</td><td>${esc(a.behavior||a.status)}</td><td>${esc(a.teacher)}</td><td>${esc(a.time)}</td></tr>`).join("")||'<tr><td colspan="6">لا توجد سجلات.</td></tr>'}</tbody></table><div class="foot">الموجهة الطلابية أ/ مها العتيبي<br>الأستاذة فاطمة الصعب<br>${esc(SCHOOL_NAME)}<br>مديرة المدرسة أ/ عبير الحربي</div></main></body></html>`}
function printCurrentReport(){const w=window.open('','_blank');w.document.write(reportHTMLCurrent().replace('</body>','<script>setTimeout(()=>print(),500)<\/script></body>'));w.document.close()}
function exportCurrentHTML(){const blob=new Blob([reportHTMLCurrent()],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='تقرير_تعزيز_السلوك.html';a.click();URL.revokeObjectURL(a.href)}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}
loadLocal();updateClock();clockTimer=setInterval(updateClock,1000);const qclass=new URLSearchParams(location.search).get('class');if(qclass){selectedClassId=qclass;route='scan'}render();if(session())startPolling();
</script>
